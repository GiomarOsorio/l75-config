# Paquetes de L75 Config: instalador .exe (Windows), .dmg (macOS), AppImage y Flatpak (Linux).
# Se ejecuta a mano (Actions → Paquetes → Run workflow) o al subir una etiqueta vX.Y.Z;
# con etiqueta, además crea un Release de GitHub con los cuatro archivos.
name: Paquetes

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PIP_PACKAGES: pyinstaller PySide6-Essentials==6.12.0 Pillow hidapi

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
      - run: pip install PySide6-Essentials==6.12.0 Pillow hidapi
      - run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install ${{ env.PIP_PACKAGES }}
      - run: pyinstaller --noconfirm --clean packaging/l75-config.spec
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $version = python -c "import l75ctl; print(l75ctl.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\windows\l75-config.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*-Setup.exe

  macos:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install ${{ env.PIP_PACKAGES }}
      - run: packaging/macos/build_dmg.sh python
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg

  appimage:
    needs: tests
    runs-on: ubuntu-22.04   # glibc 2.35: el AppImage funciona en distros de 2022 en adelante
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 file
      - run: pip install ${{ env.PIP_PACKAGES }}
      - run: packaging/linux/build_appimage.sh python
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage

  flatpak:
    needs: tests
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Versión
        run: echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' l75ctl/__init__.py)" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: L75_Config-${{ env.VERSION }}-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.giomarosorio.L75Config.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: L75_Config-${{ env.VERSION }}-x86_64.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, appimage, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
