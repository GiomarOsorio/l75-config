<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>L75 Config · Selector de color</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="l75.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="l75" data-theme="{{theme}}" style="box-sizing: border-box; {{rootStyle}}">
<div class="pop" style="width: 296px; display: flex; flex-direction: column; gap: 12px;" role="group" aria-label="Selector de color">
<div style="position: relative; width: 100%; height: 136px; border-radius: 8px; cursor: crosshair; touch-action: none; background: linear-gradient(to top, #000000, rgba(0, 0, 0, 0)), linear-gradient(to right, #FFFFFF, rgba(255, 255, 255, 0)), {{hueColor}};" onMouseDown="{{svDown}}" onMouseMove="{{svMove}}" onMouseUp="{{svUp}}" onMouseLeave="{{svUp}}">
<span style="position: absolute; left: {{sx}}%; top: {{sy}}%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); background: {{hex}}; pointer-events: none;"></span>
</div>
<div style="position: relative; height: 14px;">
<div style="position: absolute; left: 0; right: 0; top: 1px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #FF0000, #FFFF00 17%, #00FF00 33%, #00FFFF 50%, #0000FF 67%, #FF00FF 83%, #FF0000);"></div>
<span style="position: absolute; top: 0; left: {{hx}}%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); background: {{hueColor}}; pointer-events: none;"></span>
<input type="range" min="0" max="359" step="1" value="{{h}}" onChange="{{setHue}}" aria-label="Tono" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer;">
</div>
<div style="display: flex; gap: 6px; align-items: flex-end;">
<label style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 96px; min-width: 0;">
<span class="hint">HEX</span>
<input class="field mono" type="text" value="{{hexText}}" onChange="{{setHexText}}" onBlur="{{commitHex}}" spellcheck="false" style="width: 100%; font-size: 12.5px;">
</label>
<sc-for list="{{rgb}}" as="c" hint-placeholder-count="3">
<label style="display: flex; flex-direction: column; gap: 4px; width: 50px;">
<span class="hint">{{c.n}}</span>
<input class="field mono" type="number" min="0" max="255" value="{{c.v}}" onChange="{{c.set}}" style="width: 100%; padding: 0 6px; font-size: 12.5px;">
</label>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span class="hint">Colores del teclado</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<sc-for list="{{presets}}" as="pr" hint-placeholder-count="8">
<button class="{{pr.cls}}" type="button" title="{{pr.name}}" aria-label="{{pr.name}}" style="background: {{pr.hex}};" onClick="{{pr.pick}}"></button>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"color","default":"#2BD2F0"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"onChange":{"editor":null},"embedded":{"editor":null},"$preview":{"width":320,"height":420}}'>
const PRESETS = [['Rojo', '#FF0000'], ['Naranja', '#FF8000'], ['Amarillo', '#FFFF00'], ['Verde', '#00FF00'], ['Cian', '#00FFFF'], ['Azul', '#0000FF'], ['Magenta', '#FF00FF'], ['Blanco', '#FFFFFF']];
function rgbOf(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function hexOf(r, g, b) { return '#' + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase(); }
function toHsv(hex) {
  const [r, g, b] = rgbOf(hex).map((v) => v / 255);
  const mx = Math.max(r, g, b); const mn = Math.min(r, g, b); const d = mx - mn;
  let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
  return { h, s: mx ? d / mx : 0, v: mx };
}
function fromHsv(h, s, v) {
  const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return hexOf(f(5) * 255, f(3) * 255, f(1) * 255);
}
function valid(t) { return /^#?[0-9a-fA-F]{6}$/.test(t.trim()); }
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const hex = (props.value || '#2BD2F0').toUpperCase();
    this.state = Object.assign({ hex, text: hex, drag: false }, toHsv(hex));
  }
  componentDidUpdate(pp) {
    const v = (this.props.value || '').toUpperCase();
    if (v && v !== (pp.value || '').toUpperCase() && v !== this.state.hex) this.setState(Object.assign({ hex: v, text: v }, toHsv(v)));
  }
  emit(h, s, v) {
    const hex = fromHsv(h, s, v);
    this.setState({ h, s, v, hex, text: hex });
    if (this.props.onChange) this.props.onChange(hex);
  }
  setHex(hex) {
    const up = hex.toUpperCase();
    this.setState(Object.assign({ hex: up, text: up }, toHsv(up)));
    if (this.props.onChange) this.props.onChange(up);
  }
  pickSv(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const s = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const v = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height));
    this.emit(this.state.h, s, v);
  }
  renderVals() {
    const st = this.state;
    const rgb = rgbOf(st.hex);
    return {
      theme: this.props.theme === 'light' ? 'light' : 'dark',
      rootStyle: this.props.embedded ? 'display: inline-block;' : 'min-height: 100vh; padding: 12px; background: var(--bg);',
      hex: st.hex, hexText: st.text, h: Math.round(st.h),
      hueColor: fromHsv(st.h, 1, 1), sx: Math.round(st.s * 1000) / 10, sy: Math.round((1 - st.v) * 1000) / 10, hx: Math.round(st.h / 3.59 * 10) / 10,
      svDown: (e) => { this.setState({ drag: true }); this.pickSv(e); },
      svMove: (e) => { if (this.state.drag && e.buttons === 1) this.pickSv(e); },
      svUp: () => { if (this.state.drag) this.setState({ drag: false }); },
      setHue: (e) => this.emit(Number(e.target.value), st.s || 1, st.v || 1),
      setHexText: (e) => { const t = e.target.value; this.setState({ text: t }); if (valid(t)) this.setHex(t.charAt(0) === '#' ? t : '#' + t); },
      commitHex: () => { if (!valid(st.text)) this.setState({ text: st.hex }); },
      rgb: ['R', 'G', 'B'].map((n, i) => ({
        n, v: rgb[i],
        set: (e) => { const c = rgb.slice(); c[i] = Math.max(0, Math.min(255, Number(e.target.value) || 0)); this.setHex(hexOf(c[0], c[1], c[2])); }
      })),
      presets: PRESETS.map((p) => ({ name: p[0], hex: p[1], cls: 'sw' + (p[1] === st.hex ? ' on' : ''), pick: () => this.setHex(p[1]) }))
    };
  }
}
</script>
</body>
</html>
